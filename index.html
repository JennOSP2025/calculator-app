

<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Calculator Program</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <div id="calculator">
       <input id="display" readonly>


       <div id="keys">
           <button id="plusBtn" class="operator-btn">+</button>
           <button id="Btn7">7</button>
           <button id="Btn8">8</button>
           <button id="Btn9">9</button>


           <button id="minusBtn" class="operator-btn">-</button>
           <button id="Btn4">4</button>
           <button id="Btn5">5</button>
           <button id="Btn6">6</button>


           <button id="timesBtn" class="operator-btn">*</button>
           <button id="Btn1">1</button>
           <button id="Btn2">2</button>
           <button id="Btn3">3</button>


           <button id="divideBtn" class="operator-btn">/</button>
           <button id="Btn0">0</button>
           <button id="decimalBtn">.</button>
           <button id="equal">=</button>


           <button id="clear" class="operator-btn">C</button>
       </div>
   </div>


   <script src="script.js"></script>
</body>
</html>
